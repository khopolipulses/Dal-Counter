name: Build iOS app

on:
  push:
    paths:
      - 'grain-counter-ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: grain-counter-ios
    steps:
      - uses: actions/checkout@v4

      - name: Test the counting engine
        run: swift test

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project GrainCounter.xcodeproj -scheme GrainCounter -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GrainCounter.app Payload/
          zip -qr grain-counter.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: grain-counter-ipa
          path: grain-counter-ios/grain-counter.ipa
