name: Build iOS app

on:
  push:
    paths:
      - 'grain-counter-ios/**'
      - 'grain-counter/app/src/main/java/com/dalcounter/DalCounter.java'
      - 'grain-counter/app/src/main/java/com/dalcounter/Markers.java'
      - 'grain-counter/test/Fuzz.java'
      - 'testdata/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    name: Tests, Java/Swift parity, IPA, simulator UI tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: grain-counter-ios
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Engine tests (incl. 300-image fuzz)
        run: FUZZ_OUT=$PWD/fuzz-swift.txt swift test

      - name: Java and Swift engines give bit-identical results
        run: |
          mkdir -p /tmp/t
          javac -d /tmp/t ../grain-counter/app/src/main/java/com/dalcounter/DalCounter.java \
            ../grain-counter/app/src/main/java/com/dalcounter/Markers.java ../grain-counter/test/Fuzz.java
          java -cp /tmp/t Fuzz 300 fuzz-java.txt
          diff fuzz-java.txt fuzz-swift.txt && echo "parity: 300/300 identical"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned release)
        run: |
          xcodebuild -project GrainCounter.xcodeproj -scheme GrainCounter -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GrainCounter.app Payload/
          zip -qr grain-counter.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: grain-counter-ipa
          path: grain-counter-ios/grain-counter.ipa

      - name: UI tests on the simulator (flows, accessibility audit, screenshots)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k), key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for k in reversed(ios):
              for dev in d[k]:
                  if dev['name'].startswith('iPhone') and 'Pro' in dev['name']:
                      print(dev['udid']); sys.exit()
          ")
          echo "simulator: $UDID"
          # TEST_RUNNER_-prefixed environment variables reach the test process (minus the prefix).
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/ios-screenshots" xcodebuild test -project GrainCounter.xcodeproj \
            -scheme GrainCounter -destination "id=$UDID" -derivedDataPath build-test \
            -resultBundlePath ui-tests.xcresult | tail -40
          ls ios-screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-screenshots
          path: |
            grain-counter-ios/ios-screenshots
            grain-counter-ios/fuzz-swift.txt
