plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dalcounter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dalcounter'
        minSdk 29          // Android 10+: scoped storage, so no storage permissions are needed
        targetSdk 36
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            // no shrinking: nothing to gain on a ~100 KB app
        }
    }

    lint {
        abortOnError true          // CI fails on any lint error
        checkReleaseBuilds true
        // English-only app with all UI built in code; no string resources to translate.
        disable 'SetTextI18n', 'ViewConstructor'
        // The framework ExifInterface is current from API 29 (minSdk) and patched with the OS; no libraries are used.
        disable 'ExifInterface'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Deliberately no dependencies: plain Android framework only, so the APK stays tiny.
