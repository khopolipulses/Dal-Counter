# XcodeGen spec: `xcodegen generate` turns this into GrainCounter.xcodeproj (done by the GitHub workflow).
name: GrainCounter
options:
  bundleIdPrefix: com.dalcounter
  deploymentTarget:
    iOS: "15.0"
targets:
  GrainCounter:
    type: application
    platform: iOS
    sources:
      - App
      - Core          # the counting engine, shared with the `swift test` package
    settings:
      base:
        PRODUCT_NAME: GrainCounter
        PRODUCT_BUNDLE_IDENTIFIER: com.dalcounter.graincounter
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - GrainCounterUITests
  GrainCounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: ../testdata      # the same test photos as the Android device test
        buildPhase: resources
        includes: ["*.jpg"]
    dependencies:
      - target: GrainCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dalcounter.graincounter.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: GrainCounter
